# The git `pre-commit` hook pre-commit.com installs from this repository:
# `claims.pre_commit`, the same per-repository decision as the plugin's
# `PreToolUse` hook. It reads the whole working tree against `HEAD`, not
# the staged file list, so it takes no filenames and runs on every commit.
- id: claims
  name: claims
  description: Check documentation and agent-instruction claims against the code they describe.
  entry: claims-pre-commit
  language: python
  pass_filenames: false
  always_run: true
