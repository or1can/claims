[project]
name = "claims"
version = "0.17.2"
description = "Checks documentation and agent-instruction claims against the code they describe."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/or1can/claims"

[project.scripts]
claims-pre-commit = "claims.pre_commit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright==1.1.414"]
