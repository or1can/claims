# This repo's own config for the `claims` plugin it installs on itself
# (ticket 25). See `claims/config.py` and each check's own page under
# `docs/checks/` for what a check's defaults are, otherwise.

# The commit gate blocks on an unmarked finding from these three: each is
# brought in by the commit's own edit, a sentence it added or one it
# retracted that another file still asserts, so that commit is where it is
# cheapest to fix or mark. `stale-claims`, `spliced-docs` and
# `judgment-agent` rank or sweep text the commit didn't write, so they
# fail only at pre-push and in CI, which pass `--fail-on-unmarked` for
# every markable check (ADR 0012). The same split `ratect` runs on.
[hook]
fail_on_unmarked = ["claim-words", "temporal-words", "restatement"]

# `.scratch/claims-consolidation/` is historical design-notes prior art —
# it discusses other real projects (`ratect`) and hypothetical example
# paths by design, not this repo's own current tree, so a bare path
# mention there intentionally won't resolve (ticket #16).
#
# `decisions/` is checked, but as `historical`: an ADR is frozen at its
# decision's date, so a path it names that has since moved — the
# pre-move `docs/adr/` since ADR 0004 — resolves at the commit that wrote
# the line (ADR 0002). Its hypothetical paths carry an example marker
# instead, which binds to the one mention rather than the whole file.
[check-file-refs]
exclude = [".scratch/*", "examples/*"]
historical = ["decisions/*.md"]

# `.claude/settings.local.json` is a real, deliberately gitignored,
# per-machine file (ticket #33) — its own mention in `CHANGELOG.md`'s
# shipped entry for that ticket shouldn't gate identically to a typo. (`claims.local.toml`'s own many mentions across
# this repo never need an entry here at all: every one is a bare name
# with no directory separator, which `claims.paths.PATH_RE` never treats as a
# candidate in the first place — see this check's own page,
# `docs/checks/check-file-refs.md`.)
known_untracked = [".claude/settings.local.json"]

# Same reasoning as check-file-refs above: .scratch/'s own prior-art notes
# name scripts (`claims/cli.py`, `restatement.py`, ...) from before this
# project's own current layout, not real, currently-runnable commands.
[check-cli-flags]
exclude = [".scratch/*", "examples/*"]

# `examples/<check>/` holds each documentation page's worked example: an
# input deliberately written to trip that check, so that `docs/captures/`
# can show the real finding beside it (`scripts/capture.py`). Every check
# that takes a path-scoped `exclude` gets one here rather than being
# switched off, so the rest of the tree stays covered. `check-file-refs`
# and `check-cli-flags` carry theirs above. Of the checks with no
# `exclude`, `check-citations` reads no config at all, `judgment-agent`
# reads only `historical`, and `claim-words`, `temporal-words` and
# `check-config-defaults` sweep only what a project names, which
# `examples/` isn't.
[check-links]
exclude = ["examples/*"]

[executable-claims]
exclude = ["examples/*"]

# Same directory as the two `.scratch/*` entries above, excluded for a
# different reason: not for what its notes *say* (hypothetical paths,
# superseded script names), but because they are frozen — `AGENTS.md`'s
# "Pre-GitHub history" declares nothing under `.scratch/` a surface
# anyone keeps current. `stale-claims` ranks a section by how much the
# code it names has changed since the section was last touched, so prose
# that will never be touched again only ever climbs: 53 of the 80
# `stale-claims` findings when this glob was added, none of them
# something to act on. The check's own built-in `CHANGELOG.md` exclusion
# is additive to this and stays in force.
[stale-claims]
exclude = ["examples/*", ".scratch/*"]
# An ADR's Context and Alternatives considered describe the world the
# decision was made in and the options weighed then, true of that world
# however far the code moves, so ranking them only ever asked for a mark:
# 5 of the 61 findings over `HEAD~30` at 0.28.2. Its Decision and
# Consequences still describe what the code does, so they stay ranked.
exclude_sections = [
    "decisions/*.md#context",
    "decisions/*.md#alternatives-considered",
]

# A released `CHANGELOG.md` entry describes a change as it shipped and is
# never reworded afterwards (`AGENTS.md`, "Versioning"), so prose a later
# diff retracts elsewhere legitimately goes on being asserted there — the
# same reason `stale-claims` excludes the file built-in. It was under
# `exclude` until `historical` existed (#174), which skips the shipped
# lines alike, from the duplication count as well as the survivor sweep,
# but still reads the changelog's own diff, so an `[Unreleased]` line
# this repo edits away is searched for elsewhere. Over `HEAD~15` the
# switch changed none of the 9 findings either way. Excluding it first
# traded 31 suppressed findings for 3 new ones — two in `.scratch/`,
# and one genuine duplicate the changelog had been masking in
# `claims/hook.py`, since deleted.
#
# `.scratch/*` is excluded for the reason `stale-claims` gives above: the
# archive is frozen, so a retracted line still asserted there will never
# be reconciled, and a finding in it is nothing anyone will act on. Over
# `HEAD~15` that removed 66 findings, all in `.scratch/`, and for the
# same reason as the changelog surfaced 9 new ones outside it that the
# archive had been holding under `duplication_threshold`.
[restatement]
exclude = ["examples/*", ".scratch/*"]
historical = ["CHANGELOG.md"]

[check-env-vars]
exclude = ["examples/*"]

# `spliced-docs` reads only `*.rs` and `*.swift`, and has no `exclude`
# key, so a Swift or Rust example under `examples/` can't be path-scoped
# out. The only Swift and Rust in this tree are worked examples, and
# `spliced-docs`' own (`examples/spliced-docs/`) is a splice by design
# that the check would otherwise report on every commit, so the check is
# switched off at commit time instead. The CLI and the skill still show
# that finding. Re-enable it if any Swift or Rust ever lands outside
# `examples/`.
[spliced-docs]
enabled = false

# `claim-words` is opt-in by omission — an empty `files` sweeps nothing —
# so this section is what makes the check run on this repo at all (#55).
# Each glob was chosen from what it was measured to find over `HEAD~1`,
# `HEAD~5` and `HEAD~15` at 6b72e14 (9 / 20 / 132 findings), not from
# what kind of file it is. Agent instructions and the site's prose pages
# earn their place on the counts and totalising claims they make about
# this tree — "five canonical roles", "twelve checks", "read nothing from
# `claims.toml`" — which is the class of sentence that rots the day a
# sixth, a thirteenth, or an `enabled` key arrives. That last one was
# false when this section landed, and is what the adoption pass fixed.
#
# Measured and deliberately absent — re-adding one wants new reasoning,
# not just an edit here:
#
# - `decisions/*.md` and `CHANGELOG.md` are predominantly dated claims
#   (`CONTEXT.md`), which is the opposite of what this check wants. An
#   ADR's counts are frozen at the decision's date on purpose, and a
#   shipped changelog entry is never reworded (`AGENTS.md`,
#   "Versioning"); on #55's own measurement of a list built around them,
#   over the same `HEAD~15`, they supplied 77 of its 99 findings,
#   essentially none actionable — a denominator from that list, not from
#   the 132 above. Sweeping only an ADR's "Consequences" section, the part
#   meant to stay true, would be the finer cut — the check can't key on
#   document structure today.
# - `docs/checks/*.md` and `docs/SUMMARY.md`. The check pages were the
#   noisiest source measured: precisely-hedged reference prose trips
#   `totalising` and `counts` on careful writing far more than on
#   anything at risk of drifting, and `tests/test_check_pages.py` and
#   `tests/test_captures.py` already hold those pages to the code.
#   `docs/SUMMARY.md` is navigation links, which can't form a sentence.
# - `CONTRIBUTING.md` produced nothing across every range measured, and
#   `.scratch/*` is the frozen pre-GitHub archive that three checks above
#   already exclude for being prose nobody will touch again.
#
# `docs/concepts.md` and `docs/configuring.md` are the same genre as the
# check pages and carry the same residual noise — 65 of the 132 between
# them — and are kept anyway rather than narrowed away: they are where
# this project's cross-cutting counts and absolutes live, `configuring.md`
# is where the one real defect of the first pass was found, and the
# steady-state cost is the per-commit number (9 over `HEAD~1`), not the
# fifteen-commit one. Narrow them if a later pass finds no defect.
#
# `docs/tutorial.md` was measured on its own, over its whole history
# (`--diff-range e7af269~1` at d95e9dc, e7af269 being the commit that
# added the page, so every line counts as added): 28 findings, nearly all
# counts and absolutes about what setup, the two hooks and the commands
# do. Those are live claims about this tree that drift when the
# tutorial's script or hooks change, and one was already false — "Setup
# writes three git settings", when the third was an option to `git init`.
#
# `*` spans `/` here (`fnmatch`, not path-segment globbing), so `docs/`'s
# top-level pages are named individually rather than as `docs/*.md`,
# which would pull `docs/checks/` back in.
[claim-words]
files = [
    "AGENTS.md",
    "CONTEXT.md",
    "TODO.md",
    "README.md",
    "agents/*.md",
    "claims/skill/SKILL.md",
    "docs/concepts.md",
    "docs/configuring.md",
    "docs/index.md",
    "docs/installation.md",
    "docs/tutorial.md",
]

# `temporal-words` is opt-in by omission the same way `claim-words` above
# is, and wants a different file set: the pages describing what this tool
# does now, with every file of dated claims left out. The list is the
# site's own prose pages plus the README, measured over `HEAD~1`,
# `HEAD~5` and `HEAD~15` at 4afaff6 (0 / 0 / 3 findings). Zero over a
# release's worth of commits is the expected steady state, not a sign the
# globs are wrong: `agents/docs.md` already forbids a version
# number or a "not yet" on a page editorially, and this is the mechanical
# backstop for a rule that was enforced by review alone.
#
# Measured and deliberately absent — re-adding one wants new reasoning,
# not just an edit here:
#
# - `docs/checks/*.md`, the noisiest source measured by a wide margin: 17
#   findings over `HEAD~15`, 12 of them one sentence shape. Every check
#   page's "Retirement markers" section quotes the lead-in "Previously
#   said:", and a word list cannot tell a quoted marker from a dated
#   claim. A check page is reference prose and belongs here on every other
#   ground; it is out until that shape can be told apart.
# - `CHANGELOG.md` and `decisions/*.md`, whose claims are dated: a shipped
#   changelog entry describes a moment, and an ADR is frozen at its
#   decision's date. `claim-words` above leaves them out for the same
#   reason.
# - `TODO.md`, for a different one: its claims are live, which is why
#   `claim-words` above sweeps it, but its temporal phrasing is correct by
#   nature, since it exists to say what isn't done yet. That is the
#   reason the two checks can't share one key. With the two above, it
#   supplied 31 findings over `HEAD~15`, none actionable.
# - `AGENTS.md`, `CONTEXT.md`, `agents/*.md` and `claims/skill/SKILL.md`:
#   contributor and agent instructions, not a description of the binary a
#   reader installed. Every hit measured across them was a rule about
#   temporal wording rather than an instance of one.
# - `docs/tutorial.md`: 5 findings over its whole history
#   (`--diff-range e7af269~1` at d95e9dc), none actionable. Three are its
#   narrative "Now you add…" and "`RELEASING.md` now reads:", and two are
#   "not yet committed" and "not yet pushed", definitions of `HEAD` and
#   of `origin/main` that are correct by nature: `agents/docs.md`'s ban
#   on "not yet" is aimed at feature status, which these are not. A
#   tutorial's "now" is a step in its sequence, not a dated claim.
#
# `docs/concepts.md` supplies all three of the findings above and is kept
# anyway, for the reason `claim-words` keeps it: it is where this
# project's cross-cutting prose lives, and three findings over fifteen
# commits is not a cost worth narrowing for.
[temporal-words]
files = [
    "README.md",
    "docs/concepts.md",
    "docs/configuring.md",
    "docs/index.md",
    "docs/installation.md",
]

# `AGENTS.md` is what the rest of this tree points contributors at, "see
# `AGENTS.md`'s Typechecking section", rather than a page whose content a
# sentence summarises. Named whole it was a subject of every such section,
# so any edit to it ranked nine unrelated sections in `stale-claims` and
# would expire their marks. A link with an anchor into it still counts.
[subjects]
navigation = ["AGENTS.md"]
