# This repo's own config for the `claims` plugin it installs on itself
# (ticket 25). See `claims/config.py` and each check's own page under
# `docs/checks/` for what a check's defaults are, otherwise.

# `.scratch/claims-consolidation/` is historical design-notes prior art —
# it discusses other real projects (`ratect`) and hypothetical example
# paths by design, not this repo's own current tree, so a bare path
# mention there intentionally won't resolve (ticket #16). `decisions/`
# similarly narrates paths that aren't this tree's: hypothetical or
# illustrative scenarios (an ADR's own named attack example), and — since
# ADR 0004 — the pre-move `docs/adr/`, quoted deliberately to record what
# the layout used to be.
[check-file-refs]
exclude = [".scratch/*", "decisions/*.md", "examples/*"]

# `.claude/settings.local.json` is a real, deliberately gitignored,
# per-machine file (ticket #33) — its own mention in `CHANGELOG.md`'s
# shipped entry for that ticket shouldn't gate identically to a typo. (`claims.local.toml`'s own many mentions across
# this repo never need an entry here at all: every one is a bare name
# with no directory separator, which `PATH_RE` never treats as a
# candidate in the first place — see this check's own page,
# `docs/checks/check-file-refs.md`.)
known_untracked = [".claude/settings.local.json"]

# Same reasoning as check-file-refs above: .scratch/'s own prior-art notes
# name scripts (`claims/cli.py`, `restatement.py`, ...) from before this
# project's own current layout, not real, currently-runnable commands.
[check-cli-flags]
exclude = [".scratch/*", "examples/*"]

# `examples/<check>/` holds each documentation page's worked example: an
# input deliberately written to trip that check, so that `docs/captures/`
# can show the real finding beside it (`scripts/capture.py`). Every check
# that takes a path-scoped `exclude` gets one here rather than being
# switched off, so the rest of the tree stays covered. `check-file-refs`
# and `check-cli-flags` carry theirs above. Of the checks with no
# `exclude`, `check-citations` and `judgment-agent` read no config at all,
# and `claim-words` and `check-config-defaults` sweep only what a project
# names, which `examples/` isn't.
[check-links]
exclude = ["examples/*"]

[executable-claims]
exclude = ["examples/*"]

# Same directory as the two `.scratch/*` entries above, excluded for a
# different reason: not for what its notes *say* (hypothetical paths,
# superseded script names), but because they are frozen — `AGENTS.md`'s
# "Pre-GitHub history" declares nothing under `.scratch/` a surface
# anyone keeps current. `stale-claims` ranks a section by how much the
# code it names has changed since the section was last touched, so prose
# that will never be touched again only ever climbs: 53 of the 80
# `stale-claims` findings when this glob was added, none of them
# something to act on. The check's own built-in `CHANGELOG.md` exclusion
# is additive to this and stays in force.
[stale-claims]
exclude = ["examples/*", ".scratch/*"]

# A released `CHANGELOG.md` entry describes a change as it shipped and is
# never reworded afterwards (`AGENTS.md`, "Versioning"), so prose a later
# diff retracts elsewhere legitimately goes on being asserted there — the
# same reason `stale-claims` excludes the file built-in, and the check's
# own documented example of this key (`docs/checks/restatement.md`).
# Excluding a file drops it from the duplication count as well as from
# the survivor sweep, so this isn't purely subtractive: a text the
# changelog held the second surviving copy of now falls under
# `duplication_threshold` and gets reported where it lives. Over
# `HEAD~15` that traded 31 suppressed findings for 3 new ones — two in
# `.scratch/`, which this check doesn't exclude (see `TODO.md`), and one
# genuine duplicate in `claims/hook.py` the changelog had been masking.
[restatement]
exclude = ["examples/*", "CHANGELOG.md"]

[check-env-vars]
exclude = ["examples/*"]

# `spliced-docs` reads only `*.rs` and `*.swift`, and has no `exclude`
# key, so a Swift or Rust example under `examples/` can't be path-scoped
# out. The only Swift and Rust in this tree are worked examples, and
# `spliced-docs`' own (`examples/spliced-docs/`) is a splice by design
# that the check would otherwise report on every commit, so the check is
# switched off at commit time instead. The CLI and the skill still show
# that finding. Re-enable it if any Swift or Rust ever lands outside
# `examples/`.
[spliced-docs]
enabled = false
